<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f20">
  <title>TIGER MasterClass</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐯</text></svg>">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <button type="button" class="brand grow header-profile" id="profile-btn" aria-label="Профиль">
        <div class="brand__logo">🐯</div>
        <div class="brand__text">
          <div class="brand__title" id="header-team">TIGER</div>
          <div class="brand__sub" id="header-user">—</div>
        </div>
      </button>
      <div class="header-actions">
        <button type="button" class="icon-btn" id="messages-btn" data-i18n-aria="messages.title">
          <span aria-hidden="true">💬</span>
          <span class="icon-btn__badge" id="msg-badge" hidden></span>
        </button>
        <div data-lang-switch></div>
        <button type="button" class="btn btn--ghost btn--sm" id="logout-btn">
          🚪 <span data-i18n="nav.logout">Выход</span>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="page" id="page-tasks" data-view="tasks"></section>
      <section class="page" id="page-quiz" data-view="quiz"></section>
      <section class="page" id="page-voting" data-view="voting"></section>
      <section class="page" id="page-rating" data-view="leaderboard"></section>
      <section class="page" id="page-team" data-view="team"></section>
      <section class="page" id="page-messages" data-view="messages"></section>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button type="button" class="nav-btn" data-nav="tasks">
        <span class="nav-btn__icon">📋</span>
        <span class="nav-btn__label" data-i18n="nav.tasks">Задания</span>
      </button>
      <button type="button" class="nav-btn" data-nav="quiz">
        <span class="nav-btn__icon">🧠</span>
        <span class="nav-btn__label" data-i18n="nav.quiz">Тест</span>
      </button>
      <button type="button" class="nav-btn" data-nav="voting">
        <span class="nav-btn__icon">🗳️</span>
        <span class="nav-btn__label" data-i18n="nav.voting">Голосование</span>
      </button>
      <button type="button" class="nav-btn" data-nav="rating">
        <span class="nav-btn__icon">🏆</span>
        <span class="nav-btn__label" data-i18n="nav.rating">Рейтинг</span>
      </button>
      <button type="button" class="nav-btn" data-nav="team">
        <span class="nav-btn__icon">👥</span>
        <span class="nav-btn__label" data-i18n="nav.team">Команда</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
